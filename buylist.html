<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Legacy buylist page — redirect to sell.html
        const params = new URLSearchParams(window.location.search);
        const dealer = params.get('dealer');
        window.location.replace(dealer ? 'sell.html?dealer=' + dealer : 'sell.html');
    </script>
</head>
<body></body>
</html>
