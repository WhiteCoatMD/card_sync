<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Sync — Orders</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        .header { background: #1a1a2e; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 8px; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-size: 13px; text-decoration: none; }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: #4a90d9; border-color: #4a90d9; }
        .btn-primary:hover { background: #3a7bc8; }
        .btn-success { background: #4caf50; border-color: #4caf50; }
        .btn-warning { background: #ff9800; border-color: #ff9800; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }
        .toolbar select { padding: 8px 12px; border: 1px solid #333; border-radius: 6px; background: #1a1a2e; color: #fff; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; background: #1a1a2e; border-radius: 10px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2a2a3e; font-size: 14px; }
        th { background: #12122a; color: #aaa; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:hover { background: rgba(255,255,255,0.03); }
        tr.expandable { cursor: pointer; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-buy { background: rgba(255,152,0,0.2); color: #ff9800; }
        .badge-sell { background: rgba(76,175,80,0.2); color: #4caf50; }
        .badge-pending { background: rgba(74,144,217,0.2); color: #4a90d9; }
        .badge-completed { background: rgba(76,175,80,0.2); color: #4caf50; }
        .badge-cancelled { background: rgba(158,158,158,0.2); color: #9e9e9e; }
        .order-detail { display: none; }
        .order-detail.active { display: table-row; }
        .order-detail td { background: #12122a; padding: 16px 24px; }
        .detail-table { width: 100%; margin-top: 8px; }
        .detail-table th { background: transparent; color: #666; font-size: 11px; padding: 6px 10px; }
        .detail-table td { padding: 8px 10px; font-size: 13px; border-bottom-color: #1a1a2e; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 1.5rem; }
        .empty { text-align: center; padding: 3rem; color: #666; }
        .price { font-weight: 600; }
        .price-buy { color: #ff9800; }
        .price-sell { color: #4caf50; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 12px; padding: 30px; width: 100%; max-width: 700px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { margin-bottom: 20px; font-size: 1.2rem; }
        .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
        .form-group { flex: 1; }
        .form-group label { display: block; color: #aaa; font-size: 12px; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #0d0d1a; color: #fff; font-size: 14px; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .order-items-list { margin-top: 16px; }
        .order-item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; padding: 10px; background: #0d0d1a; border-radius: 6px; }
        .order-item-row input { flex: 1; padding: 8px; border: 1px solid #333; border-radius: 4px; background: #1a1a2e; color: #fff; font-size: 13px; }
        .order-item-row input:focus { outline: none; border-color: #4a90d9; }
        .order-total { text-align: right; font-size: 18px; font-weight: 700; margin-top: 12px; padding-top: 12px; border-top: 1px solid #333; }
        .ship-btn { background: #2196f3; border-color: #2196f3; }
        .tracking-link { color: #4a90d9; text-decoration: none; font-size: 12px; }
        .rate-option { background: #0d0d1a; border: 1px solid #333; border-radius: 6px; padding: 10px 14px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
        .rate-option:hover, .rate-option.selected { border-color: #4a90d9; }
        .rate-carrier { font-weight: 600; font-size: 13px; }
        .rate-service { color: #888; font-size: 12px; }
        .rate-price { font-weight: 700; color: #4caf50; font-size: 15px; }
        .rate-days { color: #888; font-size: 11px; }
        .label-success { background: rgba(76,175,80,0.1); border: 1px solid rgba(76,175,80,0.3); border-radius: 8px; padding: 16px; text-align: center; margin-top: 16px; }
        .label-success a { color: #4caf50; font-weight: 700; text-decoration: none; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Card Sync — Orders</h1>
        <div class="nav">
            <a href="admin.html" class="btn">Dashboard</a>
            <a href="inventory.html" class="btn">Inventory</a>
            <a href="marketplace.html" class="btn">Marketplace</a>
            <a href="integrations.html" class="btn">Integrations</a>
            <button class="btn btn-success" onclick="openOrderModal('sell')">+ New Sale</button>
            <button class="btn btn-warning" onclick="openOrderModal('buy')">+ New Buy</button>
        </div>
    </div>

    <div class="container">
        <div class="toolbar">
            <select id="filter-type" onchange="loadOrders()">
                <option value="">All Types</option>
                <option value="sell">Sales</option>
                <option value="buy">Purchases</option>
            </select>
            <select id="filter-status" onchange="loadOrders()">
                <option value="">All Status</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
            </select>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Type</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Shipping</th>
                    <th>Date</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="orders-body">
            </tbody>
        </table>

        <div class="pagination" id="pagination"></div>
    </div>

    <!-- New Order Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modal-title">New Sale</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Customer Name</label>
                    <input type="text" id="field-customer_name" placeholder="Walk-in customer">
                </div>
            </div>
            <div class="form-group">
                <label>Notes</label>
                <textarea id="field-notes" placeholder="Order notes..."></textarea>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px;">
                <h3 style="font-size:14px;color:#aaa;">Items</h3>
                <button class="btn btn-sm btn-primary" onclick="addItemRow()">+ Add Item</button>
            </div>
            <div class="order-items-list" id="order-items"></div>
            <div class="order-total" id="order-total">Total: $0.00</div>

            <div class="modal-actions">
                <button class="btn" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="submitOrder()">Create Order</button>
            </div>
        </div>
    </div>

    <!-- Shipping Modal -->
    <div class="modal-overlay" id="ship-modal" onclick="if(event.target===this)closeShipModal()">
        <div class="modal">
            <h2>Ship Order <span id="ship-order-id"></span></h2>
            <div id="ship-step-address">
                <div class="form-row">
                    <div class="form-group"><label>Recipient Name *</label><input type="text" id="ship-name"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Street Address *</label><input type="text" id="ship-street1"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Apt/Suite</label><input type="text" id="ship-street2"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>City *</label><input type="text" id="ship-city"></div>
                    <div class="form-group" style="flex:0.5;"><label>State *</label><input type="text" id="ship-state" maxlength="2" placeholder="TN"></div>
                    <div class="form-group" style="flex:0.5;"><label>ZIP *</label><input type="text" id="ship-zip" maxlength="10"></div>
                </div>
                <div class="form-row">
                    <div class="form-group" style="flex:0.5;"><label>Weight (oz)</label><input type="number" id="ship-weight" value="3" step="0.5" min="0.5"></div>
                </div>
                <div class="modal-actions">
                    <button class="btn" onclick="closeShipModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="getRates()">Get Rates</button>
                </div>
            </div>
            <div id="ship-step-rates" style="display:none;">
                <div id="rates-list"></div>
                <div class="modal-actions">
                    <button class="btn" onclick="document.getElementById('ship-step-address').style.display='';document.getElementById('ship-step-rates').style.display='none';">Back</button>
                    <button class="btn btn-primary" id="buy-label-btn" onclick="purchaseLabel()" disabled>Select a rate first</button>
                </div>
            </div>
            <div id="ship-step-done" style="display:none;"></div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'login.html';

        let hasShipping = false;
        fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
            .then(r => r.json()).then(data => {
                if (data.success) hasShipping = data.user.features.includes('shipping_labels');
            });

        let currentPage = 1;
        let orderType = 'sell';
        let inventoryCache = [];

        async function apiFetch(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...options.headers }
            });
            return res.json();
        }

        function esc(str) {
            if (!str) return '';
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        async function loadOrders() {
            const params = new URLSearchParams({ page: currentPage, limit: 50 });
            const type = document.getElementById('filter-type').value;
            const status = document.getElementById('filter-status').value;
            if (type) params.set('type', type);
            if (status) params.set('status', status);

            const data = await apiFetch(`/api/orders?${params}`);
            const tbody = document.getElementById('orders-body');

            if (!data.success || data.orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="empty">No orders found.</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tbody.innerHTML = data.orders.map(o => `
                <tr class="expandable" onclick="toggleDetail(${o.id}, this)">
                    <td>#${o.id}</td>
                    <td><span class="badge badge-${o.type}">${o.type === 'sell' ? 'Sale' : 'Purchase'}</span></td>
                    <td>${esc(o.customer_name || o.user_display_name || o.user_email || '—')}</td>
                    <td>${o.item_count} item${o.item_count != 1 ? 's' : ''}</td>
                    <td class="price ${o.type === 'sell' ? 'price-sell' : 'price-buy'}">$${parseFloat(o.total_amount).toFixed(2)}</td>
                    <td><span class="badge badge-${o.status}">${o.status}</span></td>
                    <td>${o.shipping_tracking ? '<a class="tracking-link" href="https://tools.usps.com/go/TrackConfirmAction?tLabels=' + esc(o.shipping_tracking) + '" target="_blank">' + esc(o.shipping_tracking) + '</a>' : '<span style="color:#555;">—</span>'}</td>
                    <td>${new Date(o.created_at).toLocaleDateString()}</td>
                    <td>${o.type === 'sell' && o.status === 'completed' && !o.shipping_tracking
                        ? (hasShipping
                            ? '<a class="btn btn-sm ship-btn" href="shipping.html?order=' + o.id + '" onclick="event.stopPropagation();">Ship</a>'
                            : '<button class="btn btn-sm" style="opacity:0.35;" onclick="event.stopPropagation();alert(\'Upgrade to Business plan to create shipping labels\')" title="Upgrade to unlock">&#128274; Ship</button>')
                        : (o.shipping_label_url ? '<a href="' + esc(o.shipping_label_url) + '" target="_blank" class="btn btn-sm" style="font-size:11px;" onclick="event.stopPropagation();">Label</a>' : (o.shipping_tracking ? '' : ''))}</td>
                </tr>
                <tr class="order-detail" id="detail-${o.id}">
                    <td colspan="9">
                        ${o.notes ? `<p style="color:#888;margin-bottom:8px;">Notes: ${esc(o.notes)}</p>` : ''}
                        <div id="detail-items-${o.id}"><em style="color:#666">Click to load details...</em></div>
                    </td>
                </tr>
            `).join('');

            const pages = Math.ceil(data.total / data.limit);
            if (pages <= 1) { document.getElementById('pagination').innerHTML = ''; return; }
            let html = '';
            for (let i = 1; i <= pages; i++) {
                html += `<button class="btn btn-sm${i === data.page ? ' btn-primary' : ''}" onclick="currentPage=${i};loadOrders()">${i}</button>`;
            }
            document.getElementById('pagination').innerHTML = html;
        }

        async function toggleDetail(orderId, row) {
            const detail = document.getElementById(`detail-${orderId}`);
            const isActive = detail.classList.contains('active');
            document.querySelectorAll('.order-detail').forEach(d => d.classList.remove('active'));

            if (isActive) return;
            detail.classList.add('active');

            const container = document.getElementById(`detail-items-${orderId}`);
            const data = await apiFetch(`/api/orders/${orderId}`);
            if (!data.success) { container.innerHTML = '<em style="color:#f44">Failed to load</em>'; return; }

            if (data.order.items.length === 0) {
                container.innerHTML = '<em style="color:#666">No items</em>';
                return;
            }

            container.innerHTML = `<table class="detail-table">
                <thead><tr><th>Card</th><th>Category</th><th>Set</th><th>Condition</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th></tr></thead>
                <tbody>${data.order.items.map(i => `
                    <tr>
                        <td>${esc(i.card_name || 'Unknown')}</td>
                        <td>${esc(i.category || '—')}</td>
                        <td>${esc(i.set_name || '—')}</td>
                        <td>${esc(i.condition || '—')}</td>
                        <td>${i.quantity}</td>
                        <td>$${parseFloat(i.unit_price).toFixed(2)}</td>
                        <td>$${(i.quantity * parseFloat(i.unit_price)).toFixed(2)}</td>
                    </tr>
                `).join('')}</tbody>
            </table>`;
        }

        // --- New Order Modal ---
        async function openOrderModal(type) {
            orderType = type;
            document.getElementById('modal-title').textContent = type === 'sell' ? 'New Sale' : 'New Purchase';
            document.getElementById('field-customer_name').value = '';
            document.getElementById('field-notes').value = '';
            document.getElementById('order-items').innerHTML = '';
            updateOrderTotal();

            // Load inventory for item selection
            if (inventoryCache.length === 0) {
                const data = await apiFetch('/api/inventory?limit=100&status=available');
                if (data.success) inventoryCache = data.inventory;
            }

            addItemRow();
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        let itemRowId = 0;
        function addItemRow() {
            itemRowId++;
            const container = document.getElementById('order-items');
            const row = document.createElement('div');
            row.className = 'order-item-row';
            row.id = `item-row-${itemRowId}`;

            const options = inventoryCache.map(i =>
                `<option value="${i.id}" data-price="${orderType === 'sell' ? (i.sell_price || 0) : (i.buy_price || 0)}">${esc(i.name)} — ${esc(i.category)}${i.set_name ? ' / ' + esc(i.set_name) : ''} (${i.quantity} in stock)</option>`
            ).join('');

            row.innerHTML = `
                <select onchange="onItemSelect(this, ${itemRowId})" style="flex:2;padding:8px;border:1px solid #333;border-radius:4px;background:#1a1a2e;color:#fff;font-size:13px;">
                    <option value="">Select card...</option>
                    ${options}
                </select>
                <input type="number" id="qty-${itemRowId}" value="1" min="1" style="flex:0 0 60px;" placeholder="Qty" oninput="updateOrderTotal()">
                <input type="number" id="price-${itemRowId}" step="0.01" min="0" style="flex:0 0 100px;" placeholder="Price" oninput="updateOrderTotal()">
                <button class="btn btn-sm" onclick="document.getElementById('item-row-${itemRowId}').remove();updateOrderTotal()" style="flex:0 0 auto;color:#f44;">✕</button>
            `;
            container.appendChild(row);
        }

        function onItemSelect(sel, rowId) {
            const opt = sel.selectedOptions[0];
            if (opt && opt.dataset.price) {
                document.getElementById(`price-${rowId}`).value = parseFloat(opt.dataset.price).toFixed(2);
                updateOrderTotal();
            }
        }

        function updateOrderTotal() {
            let total = 0;
            document.querySelectorAll('.order-item-row').forEach(row => {
                const qty = parseFloat(row.querySelector('input[type="number"]').value) || 0;
                const price = parseFloat(row.querySelectorAll('input[type="number"]')[1].value) || 0;
                total += qty * price;
            });
            document.getElementById('order-total').textContent = `Total: $${total.toFixed(2)}`;
        }

        async function submitOrder() {
            const items = [];
            document.querySelectorAll('.order-item-row').forEach(row => {
                const sel = row.querySelector('select');
                const inputs = row.querySelectorAll('input[type="number"]');
                if (sel.value) {
                    items.push({
                        inventory_id: parseInt(sel.value),
                        quantity: parseInt(inputs[0].value) || 1,
                        unit_price: parseFloat(inputs[1].value) || 0
                    });
                }
            });

            if (items.length === 0) return alert('Add at least one item');

            const body = {
                type: orderType,
                customer_name: document.getElementById('field-customer_name').value || null,
                notes: document.getElementById('field-notes').value || null,
                items
            };

            const data = await apiFetch('/api/orders', { method: 'POST', body: JSON.stringify(body) });
            if (data.success) {
                closeModal();
                inventoryCache = []; // refresh cache
                loadOrders();
            } else {
                alert(data.error || 'Failed to create order');
            }
        }

        loadOrders();

        // --- Shipping ---
        let shipOrderId = null;
        let shipShipmentId = null;
        let selectedRateId = null;
        let shipToAddress = null;

        function openShipModal(orderId, customerName) {
            shipOrderId = orderId;
            shipShipmentId = null;
            selectedRateId = null;
            document.getElementById('ship-order-id').textContent = '#' + orderId;
            document.getElementById('ship-name').value = customerName || '';
            document.getElementById('ship-street1').value = '';
            document.getElementById('ship-street2').value = '';
            document.getElementById('ship-city').value = '';
            document.getElementById('ship-state').value = '';
            document.getElementById('ship-zip').value = '';
            document.getElementById('ship-weight').value = '3';
            document.getElementById('ship-step-address').style.display = '';
            document.getElementById('ship-step-rates').style.display = 'none';
            document.getElementById('ship-step-done').style.display = 'none';
            document.getElementById('ship-modal').classList.add('active');
        }

        function closeShipModal() { document.getElementById('ship-modal').classList.remove('active'); }

        async function getRates() {
            const name = document.getElementById('ship-name').value.trim();
            const street1 = document.getElementById('ship-street1').value.trim();
            const city = document.getElementById('ship-city').value.trim();
            const state = document.getElementById('ship-state').value.trim();
            const zip = document.getElementById('ship-zip').value.trim();

            if (!name || !street1 || !city || !state || !zip) return alert('Fill in all required address fields');

            shipToAddress = {
                name, street1,
                street2: document.getElementById('ship-street2').value.trim(),
                city, state, zip
            };

            const btn = event.target;
            btn.textContent = 'Getting rates...';
            btn.disabled = true;

            const data = await apiFetch('/api/shipping/rates', {
                method: 'POST',
                body: JSON.stringify({
                    order_id: shipOrderId,
                    to_address: shipToAddress,
                    weight_oz: parseFloat(document.getElementById('ship-weight').value) || 3,
                })
            });

            btn.textContent = 'Get Rates';
            btn.disabled = false;

            if (!data.success) return alert(data.error || 'Failed to get rates');

            shipShipmentId = data.shipment_id;
            selectedRateId = null;

            const ratesList = document.getElementById('rates-list');
            ratesList.innerHTML = '<p style="color:#888;font-size:13px;margin-bottom:10px;">Select a shipping rate:</p>' +
                data.rates.map(r => `
                    <div class="rate-option" onclick="selectRate('${r.id}', this)">
                        <div>
                            <div class="rate-carrier">${esc(r.carrier)}</div>
                            <div class="rate-service">${esc(r.service)}${r.delivery_days ? ' — ' + r.delivery_days + ' day' + (r.delivery_days > 1 ? 's' : '') : ''}</div>
                        </div>
                        <div class="rate-price">$${r.rate.toFixed(2)}</div>
                    </div>
                `).join('');

            document.getElementById('ship-step-address').style.display = 'none';
            document.getElementById('ship-step-rates').style.display = '';
            document.getElementById('buy-label-btn').disabled = true;
            document.getElementById('buy-label-btn').textContent = 'Select a rate first';
        }

        function selectRate(rateId, el) {
            selectedRateId = rateId;
            document.querySelectorAll('.rate-option').forEach(r => r.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('buy-label-btn').disabled = false;
            document.getElementById('buy-label-btn').textContent = 'Buy Label — $' + el.querySelector('.rate-price').textContent.replace('$', '');
        }

        async function purchaseLabel() {
            if (!shipShipmentId || !selectedRateId) return;

            const btn = document.getElementById('buy-label-btn');
            btn.textContent = 'Purchasing...';
            btn.disabled = true;

            const data = await apiFetch('/api/shipping/purchase', {
                method: 'POST',
                body: JSON.stringify({
                    order_id: shipOrderId,
                    shipment_id: shipShipmentId,
                    rate_id: selectedRateId,
                    to_address: shipToAddress,
                    weight_oz: parseFloat(document.getElementById('ship-weight').value) || 3,
                })
            });

            if (!data.success) {
                btn.textContent = 'Buy Label';
                btn.disabled = false;
                return alert(data.error || 'Failed to purchase label');
            }

            document.getElementById('ship-step-rates').style.display = 'none';
            document.getElementById('ship-step-done').style.display = '';
            document.getElementById('ship-step-done').innerHTML = `
                <div class="label-success">
                    <p style="margin-bottom:8px;">Label purchased!</p>
                    <a href="${esc(data.label_url)}" target="_blank">Download Label (PDF)</a>
                    <p style="margin-top:12px;color:#888;font-size:13px;">
                        ${esc(data.carrier)} ${esc(data.service)}<br>
                        Tracking: <strong>${esc(data.tracking_number)}</strong>
                    </p>
                </div>
                <div class="modal-actions" style="margin-top:16px;">
                    <button class="btn btn-primary" onclick="closeShipModal();loadOrders();">Done</button>
                </div>
            `;
        }
    </script>
</body>
</html>
