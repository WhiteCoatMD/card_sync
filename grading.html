<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collect Sync — Grading Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a1a; color: #fff; min-height: 100vh; }
        .header { background: #1a1a2e; padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a3e; }
        .header h1 { font-size: 1.5rem; }
        .nav { display: flex; gap: 8px; }
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-size: 13px; text-decoration: none; }
        .btn:hover { background: rgba(255,255,255,0.2); }
        .btn-primary { background: #4a90d9; border-color: #4a90d9; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .btn-danger { background: #d94a4a; border-color: #d94a4a; }
        .btn-green { background: #4caf50; border-color: #4caf50; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 2rem; }
        .stat-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 10px; padding: 16px; }
        .stat-card .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; }

        .toolbar { display: flex; gap: 10px; margin-bottom: 1.5rem; justify-content: space-between; align-items: center; }
        .filter-tabs { display: flex; gap: 0; }
        .filter-tab { padding: 8px 16px; font-size: 13px; color: #888; cursor: pointer; border: 1px solid #2a2a3e; background: #1a1a2e; }
        .filter-tab:first-child { border-radius: 6px 0 0 6px; }
        .filter-tab:last-child { border-radius: 0 6px 6px 0; }
        .filter-tab.active { color: #fff; background: #4a90d9; border-color: #4a90d9; }

        .submission-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 10px; padding: 20px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s; }
        .submission-card:hover { border-color: #4a90d9; }
        .sub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .sub-header h3 { font-size: 15px; }
        .sub-meta { font-size: 12px; color: #888; display: flex; gap: 16px; flex-wrap: wrap; }
        .sub-meta span { display: flex; align-items: center; gap: 4px; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-preparing { background: rgba(158,158,158,0.15); color: #9e9e9e; }
        .badge-shipped { background: rgba(33,150,243,0.15); color: #2196f3; }
        .badge-received { background: rgba(156,39,176,0.15); color: #9c27b0; }
        .badge-grading { background: rgba(255,152,0,0.15); color: #ff9800; }
        .badge-graded { background: rgba(76,175,80,0.15); color: #4caf50; }
        .badge-returned { background: rgba(76,175,80,0.25); color: #4caf50; }

        .company-badge { font-weight: 700; }
        .company-PSA { color: #e53935; }
        .company-BGS { color: #1565c0; }
        .company-CGC { color: #43a047; }
        .company-SGC { color: #ff9800; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #1a1a2e; border-radius: 12px; padding: 30px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; }
        .modal h2 { font-size: 1.1rem; margin-bottom: 20px; }
        .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #0d0d1a; color: #fff; font-size: 14px; font-family: inherit; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #4a90d9; }
        .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        .card-entry { background: #12122a; border: 1px solid #2a2a3e; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .card-entry-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .card-entry-header span { font-size: 12px; font-weight: 600; color: #4a90d9; }
        .remove-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 16px; }
        .remove-btn:hover { color: #f44336; }

        /* Detail view */
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; font-size: 13px; border-bottom: 1px solid #2a2a3e; }
        th { color: #888; font-size: 11px; text-transform: uppercase; }
        .grade-display { font-size: 1.2rem; font-weight: 700; }
        .roi-positive { color: #4caf50; }
        .roi-negative { color: #f44336; }
        .empty { text-align: center; padding: 3rem; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Collect Sync — Grading Tracker</h1>
        <div class="nav">
            <a href="admin.html" class="btn">Dashboard</a>
            <a href="inventory.html" class="btn">Inventory</a>
            <button class="btn btn-primary" onclick="openNewModal()">+ New Submission</button>
        </div>
    </div>

    <div class="container">
        <div class="stats-grid" id="stats-grid">
            <div class="stat-card"><div class="label">Total Submissions</div><div class="value" id="s-total">0</div></div>
            <div class="stat-card"><div class="label">In Progress</div><div class="value" style="color:#ff9800;" id="s-progress">0</div></div>
            <div class="stat-card"><div class="label">Completed</div><div class="value" style="color:#4caf50;" id="s-completed">0</div></div>
            <div class="stat-card"><div class="label">Total Cards</div><div class="value" style="color:#4a90d9;" id="s-cards">0</div></div>
            <div class="stat-card"><div class="label">Avg Grade</div><div class="value" id="s-avggrade">—</div></div>
            <div class="stat-card"><div class="label">Total Spent</div><div class="value" style="color:#ff9800;" id="s-spent">$0</div></div>
        </div>

        <div class="toolbar">
            <div class="filter-tabs">
                <div class="filter-tab active" onclick="filterStatus('')">All</div>
                <div class="filter-tab" onclick="filterStatus('preparing')">Preparing</div>
                <div class="filter-tab" onclick="filterStatus('shipped')">Shipped</div>
                <div class="filter-tab" onclick="filterStatus('received')">Received</div>
                <div class="filter-tab" onclick="filterStatus('grading')">Grading</div>
                <div class="filter-tab" onclick="filterStatus('graded')">Graded</div>
                <div class="filter-tab" onclick="filterStatus('returned')">Returned</div>
            </div>
        </div>

        <div id="submissions-list"></div>
    </div>

    <!-- New Submission Modal -->
    <div class="modal-overlay" id="new-modal" onclick="if(event.target===this)closeNewModal()">
        <div class="modal">
            <h2>New Grading Submission</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Grading Company *</label>
                    <select id="f-company">
                        <option value="PSA">PSA</option>
                        <option value="BGS">BGS (Beckett)</option>
                        <option value="CGC">CGC</option>
                        <option value="SGC">SGC</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Service Level</label>
                    <select id="f-service">
                        <option value="economy">Economy</option>
                        <option value="regular">Regular</option>
                        <option value="express">Express</option>
                        <option value="super_express">Super Express</option>
                        <option value="walkthrough">Walk-Through</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Submission/Order Number</label>
                    <input type="text" id="f-subnumber" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label>Tracking Number</label>
                    <input type="text" id="f-tracking" placeholder="Outbound tracking">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:0.5;">
                    <label>Total Cost ($)</label>
                    <input type="number" id="f-cost" step="0.01" placeholder="0.00">
                </div>
            </div>
            <h3 style="font-size:14px;margin:16px 0 10px;color:#888;">Cards</h3>
            <div id="new-cards-list"></div>
            <button class="btn btn-sm" onclick="addNewCard()" style="margin-top:8px;">+ Add Card</button>
            <div class="form-actions">
                <button class="btn" onclick="closeNewModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createSubmission()">Create Submission</button>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeDetailModal()">
        <div class="modal" id="detail-content"></div>
    </div>

    <script>
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'login.html';

        let currentFilter = '';
        let newCardCount = 0;

        function esc(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

        async function apiFetch(url, options = {}) {
            const res = await fetch(url, { ...options, headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', ...options.headers } });
            return res.json();
        }

        const statusLabels = { preparing: 'Preparing', shipped: 'Shipped', received: 'Received', grading: 'Grading', graded: 'Graded', returned: 'Returned' };
        const serviceLabels = { economy: 'Economy', regular: 'Regular', express: 'Express', super_express: 'Super Express', walkthrough: 'Walk-Through' };

        function filterStatus(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadSubmissions();
        }

        async function loadSubmissions() {
            const params = currentFilter ? '?status=' + currentFilter : '';
            const data = await apiFetch('/api/grading' + params);
            if (!data.success) return;

            // Stats
            const s = data.stats;
            document.getElementById('s-total').textContent = s.total_submissions;
            document.getElementById('s-progress').textContent = s.in_progress;
            document.getElementById('s-completed').textContent = s.completed;
            document.getElementById('s-cards').textContent = s.total_cards;
            document.getElementById('s-avggrade').textContent = s.avg_grade ? parseFloat(s.avg_grade).toFixed(1) : '—';
            document.getElementById('s-spent').textContent = '$' + parseFloat(s.total_spent || 0).toFixed(2);

            const list = document.getElementById('submissions-list');
            if (data.submissions.length === 0) {
                list.innerHTML = '<div class="empty">No grading submissions yet. Click "+ New Submission" to get started.</div>';
                return;
            }

            list.innerHTML = data.submissions.map(sub => `
                <div class="submission-card" onclick="viewSubmission(${sub.id})">
                    <div class="sub-header">
                        <h3>
                            <span class="company-badge company-${sub.grading_company}">${sub.grading_company}</span>
                            ${sub.submission_number ? ' #' + esc(sub.submission_number) : ''}
                        </h3>
                        <span class="badge badge-${sub.status}">${statusLabels[sub.status] || sub.status}</span>
                    </div>
                    <div class="sub-meta">
                        <span>${sub.item_count} card${sub.item_count > 1 ? 's' : ''}</span>
                        <span>${serviceLabels[sub.service_level] || sub.service_level || '—'}</span>
                        <span>${sub.graded_count > 0 ? sub.graded_count + ' graded' : ''}</span>
                        ${sub.total_cost > 0 ? '<span>Cost: $' + parseFloat(sub.total_cost).toFixed(2) + '</span>' : ''}
                        ${sub.total_roi != 0 ? '<span class="' + (sub.total_roi > 0 ? 'roi-positive' : 'roi-negative') + '">ROI: ' + (sub.total_roi > 0 ? '+' : '') + '$' + parseFloat(sub.total_roi).toFixed(2) + '</span>' : ''}
                        <span>${new Date(sub.created_at).toLocaleDateString()}</span>
                    </div>
                </div>
            `).join('');
        }

        async function viewSubmission(id) {
            const data = await apiFetch('/api/grading/' + id);
            if (!data.success) return alert('Failed to load submission');

            const sub = data.submission;
            const modal = document.getElementById('detail-content');

            let html = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <h2><span class="company-badge company-${sub.grading_company}">${sub.grading_company}</span> ${sub.submission_number ? '#' + esc(sub.submission_number) : 'Submission #' + sub.id}</h2>
                    <span class="badge badge-${sub.status}">${statusLabels[sub.status] || sub.status}</span>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Status</label>
                        <select id="d-status" onchange="updateField(${sub.id}, 'status', this.value)">
                            ${['preparing','shipped','received','grading','graded','returned'].map(s =>
                                '<option value="' + s + '"' + (sub.status === s ? ' selected' : '') + '>' + statusLabels[s] + '</option>'
                            ).join('')}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Submission Number</label>
                        <input type="text" value="${esc(sub.submission_number || '')}" onchange="updateField(${sub.id}, 'submission_number', this.value)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Tracking (Outbound)</label>
                        <input type="text" value="${esc(sub.tracking_number || '')}" onchange="updateField(${sub.id}, 'tracking_number', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Return Tracking</label>
                        <input type="text" value="${esc(sub.return_tracking || '')}" onchange="updateField(${sub.id}, 'return_tracking', this.value)">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Total Cost ($)</label>
                        <input type="number" step="0.01" value="${sub.total_cost || ''}" onchange="updateField(${sub.id}, 'total_cost', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Est. Completion</label>
                        <input type="date" value="${sub.estimated_completion ? sub.estimated_completion.split('T')[0] : ''}" onchange="updateField(${sub.id}, 'estimated_completion', this.value)">
                    </div>
                </div>

                <h3 style="margin:20px 0 10px;font-size:14px;">Cards (${sub.items.length})</h3>
                <table>
                    <thead><tr><th>Card</th><th>Cert #</th><th>Grade</th><th>Pre-Grade $</th><th>Post-Grade $</th><th>ROI</th></tr></thead>
                    <tbody>
                        ${sub.items.map(item => {
                            const roi = (item.post_grade_value && item.pre_grade_value) ? (parseFloat(item.post_grade_value) - parseFloat(item.pre_grade_value)) : null;
                            return `<tr>
                                <td><strong>${esc(item.card_name)}</strong></td>
                                <td><input type="text" style="width:100px;padding:4px 6px;background:#0d0d1a;border:1px solid #333;border-radius:4px;color:#fff;font-size:12px;" value="${esc(item.cert_number || '')}" onchange="updateItem(${sub.id}, ${item.id}, 'cert_number', this.value)"></td>
                                <td><input type="number" step="0.5" style="width:60px;padding:4px 6px;background:#0d0d1a;border:1px solid #333;border-radius:4px;color:#fff;font-size:12px;" value="${item.grade || ''}" onchange="updateItem(${sub.id}, ${item.id}, 'grade', this.value)"></td>
                                <td><input type="number" step="0.01" style="width:80px;padding:4px 6px;background:#0d0d1a;border:1px solid #333;border-radius:4px;color:#fff;font-size:12px;" value="${item.pre_grade_value || ''}" onchange="updateItem(${sub.id}, ${item.id}, 'pre_grade_value', this.value)"></td>
                                <td><input type="number" step="0.01" style="width:80px;padding:4px 6px;background:#0d0d1a;border:1px solid #333;border-radius:4px;color:#fff;font-size:12px;" value="${item.post_grade_value || ''}" onchange="updateItem(${sub.id}, ${item.id}, 'post_grade_value', this.value)"></td>
                                <td class="${roi !== null ? (roi >= 0 ? 'roi-positive' : 'roi-negative') : ''}">${roi !== null ? (roi >= 0 ? '+' : '') + '$' + roi.toFixed(2) : '—'}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>

                <div class="form-actions">
                    ${sub.status === 'preparing' ? '<button class="btn btn-danger btn-sm" onclick="deleteSubmission(' + sub.id + ')">Delete</button>' : ''}
                    <button class="btn" onclick="closeDetailModal()">Close</button>
                </div>
            `;

            modal.innerHTML = html;
            document.getElementById('detail-modal').classList.add('active');
        }

        async function updateField(id, field, value) {
            await apiFetch('/api/grading/' + id, { method: 'PUT', body: JSON.stringify({ [field]: value || null }) });
            loadSubmissions();
        }

        async function updateItem(subId, itemId, field, value) {
            await apiFetch('/api/grading/' + subId, {
                method: 'PUT',
                body: JSON.stringify({ items: [{ id: itemId, [field]: value || null }] })
            });
        }

        async function deleteSubmission(id) {
            if (!confirm('Delete this submission?')) return;
            const data = await apiFetch('/api/grading/' + id, { method: 'DELETE' });
            if (data.success) { closeDetailModal(); loadSubmissions(); }
            else alert(data.error);
        }

        // New submission
        function openNewModal() { newCardCount = 0; document.getElementById('new-cards-list').innerHTML = ''; addNewCard(); document.getElementById('new-modal').classList.add('active'); }
        function closeNewModal() { document.getElementById('new-modal').classList.remove('active'); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.remove('active'); }

        function addNewCard() {
            newCardCount++;
            const div = document.createElement('div');
            div.className = 'card-entry';
            div.innerHTML = `
                <div class="card-entry-header"><span>Card #${newCardCount}</span><button class="remove-btn" onclick="this.closest('.card-entry').remove()">&times;</button></div>
                <div class="form-row">
                    <div class="form-group" style="flex:2;"><label>Card Name *</label><input type="text" class="nc-name"></div>
                    <div class="form-group"><label>Declared Value ($)</label><input type="number" class="nc-declared" step="0.01"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Pre-Grade Value ($)</label><input type="number" class="nc-pregrade" step="0.01"></div>
                    <div class="form-group"><label>Grading Fee ($)</label><input type="number" class="nc-fee" step="0.01"></div>
                </div>
            `;
            document.getElementById('new-cards-list').appendChild(div);
        }

        async function createSubmission() {
            const entries = document.querySelectorAll('#new-cards-list .card-entry');
            const items = [];
            entries.forEach(e => {
                const name = e.querySelector('.nc-name').value.trim();
                if (!name) return;
                items.push({
                    card_name: name,
                    declared_value: e.querySelector('.nc-declared').value || null,
                    pre_grade_value: e.querySelector('.nc-pregrade').value || null,
                    grading_fee: e.querySelector('.nc-fee').value || null,
                });
            });

            if (items.length === 0) return alert('Add at least one card');

            const data = await apiFetch('/api/grading', {
                method: 'POST',
                body: JSON.stringify({
                    grading_company: document.getElementById('f-company').value,
                    service_level: document.getElementById('f-service').value,
                    submission_number: document.getElementById('f-subnumber').value || null,
                    tracking_number: document.getElementById('f-tracking').value || null,
                    total_cost: document.getElementById('f-cost').value || null,
                    items,
                })
            });

            if (data.success) {
                closeNewModal();
                loadSubmissions();
            } else {
                alert(data.error || 'Failed to create submission');
            }
        }

        loadSubmissions();
    </script>
</body>
</html>
